<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="comp1800 template" content="My 1800 App">
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Rehabo - Profile</title>
</head>

<body>

  <site-navbar></site-navbar>

<div class="d-flex justify-content-center align-items-center mt-3">
    <div>
        <div class="panel profile-cover row mb-1">
            <div class="d-flex align-items-center gap-3">
                <div class="profile-cover__img">
                     <img src="images/logo.jpg" alt="" class="rounded-circle" style="width: 5vw;">
                </div>
                <h3 class="h3 mb-0 mr-5 ml-1"> <span id="name-goes-here">friend</span> </h3>
                <div class="profile-cover__action bg--img" data-overlay="0.3">
                    <button class="btn btn-rounded btn-info">
                        <i class="fa fa-plus"></i>
                        <span>Follow</span>
                    </button>
                    <button class="btn btn-rounded btn-info">
                        <i class="fa fa-comment"></i>
                        <span>Cheer!</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="profile-cover__info">
                <ul class="nav">
                    <li class="mr-2"><strong id="streak-count">00</strong> Streak </li>
                    <li class="me-3"><a href="following.html" class="text-decoration-none text-body"><strong id="following-count">00</strong> Following</a></li>
                    <li class="mr-2"><strong id="followers-count">00</strong> Followers</li>
                </ul>
            </div>
    </div>
</div>
<div class="container py-3">
    <div class="bg-secondary-subtle rounded-3 p-3 mb-5" style="min-height: 10rem;">
      <div><b>Streaks</b></div>
      <div class="mt-2">
        <div id="streak-range">0 / 100</div>
      </div>
    </div>
</div>
<div class="container py-3">
    <div class="bg-secondary-subtle rounded-3 p-3 mb-5" style="min-height: 10rem;">
        <div class="d-flex justify-content-between align-items-center">
            <b>Followers</b>
            <a href="following.html" class="btn btn-sm btn-outline-secondary">Find people to follow</a>
        </div>
        <!-- profile.js fills this with the people who follow you -->
        <ul id="followers-list" class="list-unstyled mt-2 mb-0"></ul>
        <div id="followers-empty" class="text-muted small mt-2 d-none">Nobody is following you yet.</div>
    </div>
</div>
<div class="container py-3">
    <div class="bg-secondary-subtle rounded-3 p-3 mb-5" style="min-height: 10rem;">
        <div>Location:</div>
        <div><span id="geoloc">X</span></div>
    </div>
</div>


      <!-- Link to scripts of your own -->
      <script type="module" src="/src/app.js"></script>
      <script type="module" src="/src/streaks.js"></script>
        <!-- Other libraries here -->
        <script type="module" src="src/components/navbar.js"></script>
        <script type="module" src="src/main.js"></script>
        <script type="module" src="src/geo.js"></script>
        <script type="module" src="/src/profile.js"></script>

</body>

</html>
