<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>profile timeline - Bootdey.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="d-flex justify-content-center align-items-center mt-3">
    <div>
        <div class="panel profile-cover row mb-1">
            <div class="d-flex align-items-center gap-3">
                <div class="profile-cover__img">
                     <img src="images/logo.jpg" alt="" class="rounded-circle" style="width: 5vw;" />
                </div>
                <h3 class="h3 mb-0 mr-5 ml-1"> <span id="name-goes-here">friend</span> </h3>
                <div class="profile-cover__action bg--img" data-overlay="0.3">
                    <button class="btn btn-rounded btn-info">
                        <i class="fa fa-plus"></i>
                        <span>Follow</span>
                    </button>
                    <button class="btn btn-rounded btn-info">
                        <i class="fa fa-comment"></i>
                        <span>Cheer!</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="profile-cover__info">
                <ul class="nav">
                    <li class="mr-2"><strong>00</strong> Streak </li>
                    <li class="mr-2"><strong>00</strong> Friends</li>
                </ul>
            </div>
    </div>
</div>
<div class="container py-3">
    <div class="bg-secondary-subtle rounded-3 p-3 mb-5" style="min-height: 10rem;">
      <div><b>Streaks</b></div>
      <div class="mt-2">
        <div>XX - XX</div>
      </div>
    </div>
</div>
<div class="container py-3">
    <div class="bg-secondary-subtle rounded-3 p-3 mb-5" style="min-height: 10rem;">
        <div>Location:</div>
        <div><Span id="geoloc">X</Span></div>
    </div>
</div>


      <!-- Link to scripts of your own -->
      <script type="module" src="/src/app.js"></script>

</body>

</html>
