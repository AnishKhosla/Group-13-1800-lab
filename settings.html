<!DOCTYPE html>
<html lang="en">

<head>
    <title>Rehabo: Main Menu</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Other libraries go here -->
    <script type="module" src="src/components/navbar.js"></script>
</head>

<body>

  <site-navbar></site-navbar>
<div class="container">
        <div class="main-body">
            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Full Name</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    <input type="text" class="form-control" id="fullName" autocomplete="name">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Email</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    <input type="email" class="form-control" id="email" readonly aria-describedby="emailHelp">
                                    <div id="emailHelp" class="form-text">This is your login email, so it can't be edited here.</div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Phone</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    <input type="tel" class="form-control" id="phone" autocomplete="tel">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Mobile</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    <input type="tel" class="form-control" id="mobile" autocomplete="tel">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Address</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    <input type="text" class="form-control" id="address" autocomplete="street-address">
                                </div>
                            </div>
                            <!-- Location tracking toggle -->
                            <div class="row mb-3">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Location Tracking</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" role="switch" id="locationToggle">
                                        <label class="form-check-label" for="locationToggle" id="locationToggleLabel">Off</label>
                                    </div>
                                </div>
                            </div>
                            <!-- Notifications toggle (only saves the preference for now; nothing is sent yet) -->
                            <div class="row mb-3">
                                <div class="col-sm-3">
                                    <h6 class="mb-0">Notifications</h6>
                                </div>
                                <div class="col-sm-9 text-secondary">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" role="switch" id="notificationsToggle">
                                        <label class="form-check-label" for="notificationsToggle" id="notificationsToggleLabel">Off</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-3"></div>
                                <div class="col-sm-9 text-secondary">
                                    <div id="settingsAlert" class="alert d-none" role="alert"></div>
                                    <input type="button" class="btn btn-primary px-4" id="saveSettingsBtn" value="Save Changes">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>
</div>
<div class="container py-3">
    <div class="bg-secondary-subtle rounded-3 p-3 mb-5" style="min-height: 10rem;">
        <div>Location:</div>
        <div><span id="geoloc">X</span></div>
    </div>
</div>
<div class="container py-3">
  <div class="d-flex justify-content-end mt-4">
    <form action="/login.html" method="POST" class="d-inline">
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-box-arrow-right"></i> Sign out
      </button>
    </form>
  </div>
</div>
<style type="text/css">
body{
    background: #f7f7ff;
    margin-top:20px;
}
.card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    word-wrap: break-word;
    background-color: #fff;
    background-clip: border-box;
    border: 0 solid transparent;
    border-radius: .25rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 6px 0 rgb(218 218 253 / 65%), 0 2px 6px 0 rgb(206 206 238 / 54%);
}
.me-2 {
    margin-right: .5rem!important;
}
</style>
      <script type="module" src="/src/app.js"></script>

<!-- Loads / saves the settings (name, phone, address, location tracking, notifications) -->
<script type="module" src="/src/settings.js"></script>
<script type="module" src="src/geo.js"></script>

</body>

</html>
