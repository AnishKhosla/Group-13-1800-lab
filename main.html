              aria-label="Settings" style="width: 44px; height: 44px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
             class="w-100 h-100" aria-hidden="true">

        </svg>
      </button>

      <!-- Title (main.js fills in the name and adds the "!") -->
      <h1 class="h2 fw-bold mb-0 text-center">Home of <span id="name-goes-here">friend</span></h1>

      <!-- Pet button (placeholder, doesn't do anything yet) -->
      <button type="button" id="petBtn"
              class="btn rounded-circle border border-2 p-1 d-flex align-items-center justify-content-center overflow-hidden"
              aria-label="Pet" style="width: 48px; height: 48px;">
        <!-- PASTE YOUR IMAGE PATH IN src BELOW -->
        <img src="/images/pet.png" alt="Pet" class="w-100 h-100 object-fit-contain">
      </button>
    </div>

    <!-- Streaks box -->
    <div class="bg-secondary-subtle rounded-3 p-3 mb-5" style="min-height: 10rem;">
      <div>Streaks</div>
      <div class="mt-2">
        <div>Activity 1: xxx</div>
        <div>Activity 2: xxx</div>
        <div>Activity 3: xxx</div>
      </div>
    </div>

    <!-- Activities box -->
    <div class="bg-secondary-subtle rounded-3 p-3" style="min-height: 18rem;">
      <div class="d-flex justify-content-between align-items-start">
        <h2 class="h4 fw-bold mb-0">Activities</h2>

        <!-- Expand / widen button (placeholder, doesn't do anything yet) -->
        <button type="button" id="expandActivitiesBtn" class="btn btn-link text-body p-0 d-flex"
                aria-label="Expand activities" style="width: 32px; height: 32px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="square" class="w-100 h-100" aria-hidden="true">
            <path d="M10 2.5h3.5V6"/>
            <path d="M6 13.5H2.5V10"/>
          </svg>
        </button>
      </div>

      <!-- Activity content goes here -->
    </div>

  </div>
